<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>IdleWalker</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3F9E"/>
      <stop offset="1" stop-color="#191B4D"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.36" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#FFEB8A"/>
      <stop offset="0.55" stop-color="#FFD02E"/>
      <stop offset="1" stop-color="#E9A400"/>
    </radialGradient>
    <clipPath id="screen"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sky)"/>

  <g clip-path="url(#screen)">
    <!-- the walker, peeking up over the bottom edge of the screen -->
    <path d="M50 260 V196 A78 78 0 0 1 206 196 V260 Z" fill="url(#skin)"/>
    <!-- tuft -->
    <path d="M128 119 C126 106 120 99 112 96 M128 119 C129 104 134 96 142 92 M128 119 C128 110 127 104 125 100"
          fill="none" stroke="#2A1F0A" stroke-width="4.5" stroke-linecap="round"/>
    <!-- brows, raised: curious -->
    <path d="M86 150 Q101 141 116 148 M140 148 Q155 141 170 150" fill="none" stroke="#2A1F0A" stroke-width="5" stroke-linecap="round"/>
    <!-- eyes, glancing up at the resting cursor -->
    <circle cx="101" cy="176" r="20" fill="#FFFFFF"/>
    <circle cx="155" cy="176" r="20" fill="#FFFFFF"/>
    <circle cx="94" cy="169" r="10" fill="#1E1A33"/>
    <circle cx="148" cy="169" r="10" fill="#1E1A33"/>
    <circle cx="90.5" cy="165.5" r="3.4" fill="#FFFFFF"/>
    <circle cx="144.5" cy="165.5" r="3.4" fill="#FFFFFF"/>
    <!-- cheeks and a small grin -->
    <ellipse cx="76" cy="208" rx="11" ry="7" fill="#FF7A7A" opacity="0.45"/>
    <ellipse cx="180" cy="208" rx="11" ry="7" fill="#FF7A7A" opacity="0.45"/>
    <path d="M116 212 Q128 222 140 212" fill="none" stroke="#2A1F0A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- the resting mouse cursor -->
  <path transform="translate(46 38) scale(1.3)" d="M0 0 V36 L9 27.5 L15 41 L21.5 38 L15.5 25 H27 Z"
        fill="#FFFFFF" stroke="#191B4D" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- z z z: it has been idle a while -->
  <g fill="none" stroke="#A9B1FF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 74 h9 l-9 10 h9" stroke-width="3.5" opacity="0.7"/>
    <path d="M118 52 h13 l-13 14 h13" stroke-width="4.5" opacity="0.85"/>
    <path d="M142 24 h17 l-17 19 h17" stroke-width="5.5"/>
  </g>
</svg>
